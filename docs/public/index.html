<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    const path = sessionStorage.getItem('vitepressPath') || '/unity-blog/';
    sessionStorage.setItem('vitepressPath', location.pathname);
    location.replace(path + '?r=' + encodeURIComponent(location.pathname + location.search));
  </script>
</head>
<body></body>
</html>
